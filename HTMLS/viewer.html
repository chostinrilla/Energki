<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacitación Clevertech - Energki Robotics</title>
    <script src="config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap');

        /* --- FONDO INSTITUCIONAL (TECH GRID + GLOW) --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #050a12; 
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(0, 170, 255, 0.15) 0%, transparent 50%),
                linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            height: 100dvh; /* en móvil/tablet, 100vh incluye el área tapada por la barra
                                del navegador; 100dvh usa el alto real visible */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1200px;
        }

        .scene {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 75vh;
            height: 75dvh;
            transform-style: preserve-3d;
            transition: transform 2.5s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -5vh; 
        }

        /* --- PANTALLA DE BIENVENIDA (SPLASH SCREEN GLASSMORPHISM) --- */
        #intro-splash {
            position: absolute;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 15, 25, 0.6);
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            padding: 50px 80px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 0 40px rgba(0, 240, 255, 0.1);
            opacity: 0;
            transform: scale(0.85);
            transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }

        #intro-splash.active {
            opacity: 1;
            transform: scale(1);
        }

        .logo-splash {
            max-width: 450px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #intro-splash p { margin: 0; font-size: 20px; color: #aaa; letter-spacing: 2px; text-transform: uppercase;}

        /* .dashed-line: la reutilizan las líneas del escenario genérico (ver
           renderPaginaDinamica más abajo), no solo esta demo — no se borra. */
        .dashed-line { stroke-dasharray: 8 8; stroke-dashoffset: 500; transition: stroke-dashoffset 1s ease-out, opacity 0.3s; opacity: 0; }
        .dashed-line.active { stroke-dashoffset: 0; opacity: 1; }

        /* --- CLASE BASE PANELES --- */
        .pop-panel {
            position: absolute;
            background: rgba(5, 10, 18, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid #00f0ff;
            border-radius: 8px;
            padding: 15px 25px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
            opacity: 0;
            pointer-events: none;
            z-index: 50; 
        }

        .pop-panel h3 { margin: 0 0 8px 0; font-size: 16px; text-transform: uppercase; letter-spacing: 1.5px;}
        .pop-panel p { margin: 0; font-size: 20px; font-weight: bold; color: #fff;}

        .data-grid { display: grid; grid-template-columns: 1fr auto; gap: 4px; font-size: 14px; color: #d0d0d0; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 5px; }
        .data-grid div { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.05);}
        .data-grid div:nth-child(even) { text-align: right; font-weight: bold; color: #fff;}

        /* Variante para campos con muestra de color (ej. código de colores de cableado):
           el valor suele ser una frase larga, así que en vez de la rejilla de 2 columnas
           (que lo aplastaba al pelear por ancho con la columna "auto"), cada fila fluye
           como texto normal con el cuadrito de color pegado arriba a la izquierda, y el
           texto se acomoda solo sin romperse a la mitad de forma rara. */
        .data-list { display: flex; flex-direction: column; gap: 7px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 8px; margin-top: 2px; }
        .campo-row { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; line-height: 1.4; color: #d0d0d0; }
        .campo-swatch { width: 13px; height: 13px; border-radius: 3px; margin-top: 3px; border: 1px solid rgba(255,255,255,0.3); flex-shrink: 0; }
        .campo-row b { color: #fff; }


        /* --- PANELES DINÁMICOS (recibidos desde el editor) --- */
        .scene.dynamic-active .document-base,
        .scene.dynamic-active .pop-panel,
        .scene.dynamic-active .svg-overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        #dynamic-stage {
            position: absolute;
            top: 50%; left: 50%;
            /* Antes solo width:85% (relativo al ANCHO de .scene) — en una pantalla
               "horizontal" pero con poca altura disponible (ventana chaparra, o
               .scene limitado a 75dvh), esa regla no tenía techo por altura: en un
               monitor ancho, 85% podía pedir más alto de lo que .scene medía,
               saliéndose por arriba/abajo y montándose sobre la barra de controles.
               min(85%, 105dvh) agrega ese segundo techo: 105dvh = 75dvh (el alto de
               .scene) × 1.4 (el aspect-ratio) — el ancho máximo que, respetando la
               proporción 1.4:1, todavía cabe en el alto real de .scene. */
            width: min(85%, 105dvh);
            aspect-ratio: 1.4 / 1;
            transform: translate(-50%, -50%);
            transform-style: preserve-3d;
            opacity: 0;
            pointer-events: none;
            /* transform también transiciona (2s, mismo timing que .dyn-doc de abajo):
               el paneo de cámara de .is-3d (ver más abajo) solo debe entrar en efecto
               JUNTO con la inclinación, no antes — si no, el documento se corre de
               más mientras todavía está plano (antes de inclinarse no hay nada que
               compense ese corrimiento, así que se veía cortado). */
            transition: opacity 0.6s ease, transform 2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        /* Visible desde el inicio (plano, 2D), no aparece de golpe. Lo único que
           cambia al llegar a "portada" (is-3d) es el giro. */
        .scene.dynamic-active #dynamic-stage { opacity: 1; }
        /* Paneo de cámara (44% en X), calibrado a ojo contra el editor: mueve TODO
           el conjunto en bloque (marco plano + imagen inclinada + pines + tarjetas,
           ya que #dynamic-overlay-root sigue este rectángulo en vivo, ver
           syncOverlayRootRect) para compensar el corrimiento de .dyn-doc de abajo y
           que el documento quede completo y alineado en pantalla. Solo aplica en
           is-3d, en paralelo con esa misma inclinación — nunca mientras está plano. */
        .scene.dynamic-active.is-3d #dynamic-stage { transform: translate(-6%, -50%); }

        /* Vive fuera de .scene por completo (.scene también tiene su propio
           transform-style:preserve-3d, así que ser hermana DENTRO de .scene no
           bastaba: seguía compartiendo profundidad 3D con el documento). Al estar
           afuera, con position:fixed, ya no comparte ESE espacio para nada. Su
           tamaño/posición los pone JS (ver syncDynLines), copiando en vivo el
           rectángulo real de #dynamic-stage. */
        #dynamic-overlay-root {
            position: fixed;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        #dynamic-overlay-root.is-visible { opacity: 1; }

        /* Base que se inclina en 3D */
        .dyn-doc {
            position: absolute;
            inset: 0;
            background: #111;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            transition: all 2s cubic-bezier(0.25, 1, 0.5, 1);
            /* translateX/Y en 0 a propósito (aunque no hagan nada aquí): para que
               la transición hacia .is-3d (que sí las usa, ver abajo) anime cada
               función por separado en vez de caer a una interpolación de matriz —
               si las dos listas de transform no tienen la MISMA cantidad/orden de
               funciones, el navegador no puede interpolarlas función por función y
               el giro se veía torcido/descuadrado a medio camino. */
            transform: translateX(0%) translateY(0%) rotateX(0deg) rotateZ(0deg) translateZ(0px);
        }
        /* Plana y atenuada durante la bienvenida, para que no compita
           visualmente con el modal de la intro. */
        .scene.splash-active .dyn-doc { filter: brightness(0.2) blur(5px); }

        .scene.dynamic-active.is-3d .dyn-doc {
            /* translateX/Y calibrados a ojo contra el editor para que la imagen
               inclinada quede alineada con el marco plano donde viven las tarjetas
               — van PRIMERO (se aplican último, ya con la imagen inclinada) para
               correrla en la pantalla sin tocar el ángulo. Son % del propio
               ancho/alto de .dyn-doc, así que el mismo número sirve en cualquier
               tamaño de ventana. */
            transform: translateX(-43%) translateY(-1%) rotateX(55deg) rotateZ(-20deg) translateZ(15px);
            box-shadow: -30px 40px 50px rgba(0,0,0,0.9);
            filter: brightness(0.85);
        }

        #dynamic-image { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }

        /* Capa plana (sin inclinar) para pines, líneas y tarjetas flotantes */
        .dyn-overlay { position: absolute; inset: 0; }
        /* overflow:visible es necesario: los <svg> recortan por defecto cualquier
           cosa que se salga de su propio marco, y las líneas apuntan a tarjetas que
           a propósito pueden estar posicionadas fuera del 0-100% (afuera del
           documento) — sin esto, la parte de la línea más allá del borde del SVG
           desaparecía aunque apuntara bien. */
        .dyn-overlay-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }

        .dyn-pin {
            position: absolute;
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 2px solid #fff;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }
        .dyn-pin.active { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }

        .dyn-popup.pop-panel {
            position: absolute;
            max-width: 300px;
            /* Solo se centra verticalmente; el lado (izq/der) fija su propio borde
               (left o right, nunca ambos) para que la tarjeta jamás se salga de    
               pantalla sin importar qué tan ancha salga según su contenido. */
            transform: translateY(-50%) scale(0.9);
            /* Solo opacity/transform (lo único que cambia .active de aquí abajo).
               NUNCA "all": top/left/right se fijan una sola vez por JS al crear la
               tarjeta, y si se transicionan, getBoundingClientRect() las mide a la
               mitad del movimiento — la línea terminaba apuntando a donde la
               tarjeta iba de camino, no a donde realmente quedó. */
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .dyn-popup.pop-panel.active { opacity: 1; transform: translateY(-50%) scale(1); }
        /* Negativo a propósito: separa la tarjeta del documento hacia el fondo
           oscuro del escenario 3D, en vez de quedar montada encima de la imagen
           (que es justo lo que se veía apretado/pegado a la línea). En pantallas
           angostas se recorta este offset (ver media query de abajo) para no
           sacar la tarjeta de la pantalla, ya que ahí casi no sobra espacio a los
           lados del documento. */
        .dyn-popup.pop-panel.side-left { left: -14%; transform-origin: left center; }
        .dyn-popup.pop-panel.side-right { right: -14%; transform-origin: right center; }

        /* Posición guardada a mano desde la Vista Previa del editor
           (panel.tarjeta): a diferencia de las automáticas (que solo se
           centran verticalmente y anclan un borde fijo al costado), esta se
           centra en los dos ejes porque "top"/"left" ya son el punto exacto
           que la persona eligió al arrastrarla. */
        .dyn-popup.pop-panel.explicit-pos { transform: translate(-50%, -50%) scale(0.9); }
        .dyn-popup.pop-panel.explicit-pos.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* --- UI Y EFECTO KARAOKE --- */
        .ui-container {
            position: fixed; /* ancla al viewport real del navegador, no al alto de la página */
            left: 0; right: 0;
            bottom: max(15px, env(safe-area-inset-bottom));
            width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 100;
        }
        
        #subtitle-box { 
            background: rgba(5, 10, 18, 0.9); padding: 15px 40px; border-radius: 30px; 
            font-size: 20px; text-align: center; max-width: 85%; min-height: 28px; 
            margin-bottom: 12px; border: 1px solid rgba(0,240,255,0.2); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.8); font-weight: bold;
            color: #556; 
        }
        
        .k-word { transition: color 0.1s; }
        .k-word.highlight { color: #00f0ff; text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); } 

        .controls-bar { display: flex; gap: 15px; background: rgba(5, 10, 18, 0.9); padding: 10px 20px; border-radius: 40px; border: 1px solid #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
        .ctrl-btn { background: transparent; color: #00f0ff; border: none; cursor: pointer; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .ctrl-btn[disabled] { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
        .ctrl-btn:hover { background: rgba(0, 240, 255, 0.2); transform: scale(1.1); box-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }
        .ctrl-btn:active { transform: scale(0.95); }
        #btn-play { background: rgba(0, 240, 255, 0.1); }
        #btn-restart { margin-right: 10px; border-right: 1px solid rgba(0,240,255,0.3); border-radius: 50% 0 0 50%; padding-right: 15px; }
        #btn-voice { margin-left: 10px; border-left: 1px solid rgba(0,240,255,0.3); border-radius: 0 50% 50% 0; padding-left: 15px;}

        /* Iconos de la carpeta /images (ya pintados de cian, icon-*-cy.png) como
           <img> normal adentro del botón: más simple y confiable que mask/background-image. */
        .ctrl-icon { width: 22px; height: 22px; display: block; pointer-events: none; }

        /* --- ADAPTACIÓN A PANTALLAS PEQUEÑAS (tablets/celulares) --- */
        @media (max-width: 700px) {
            #subtitle-box { font-size: 15px; padding: 10px 20px; max-width: 92%; }
            .controls-bar { gap: 8px; padding: 8px 14px; }
            .ctrl-btn { width: 38px; height: 38px; }
            .ctrl-icon { width: 18px; height: 18px; }
            .dyn-popup.pop-panel { max-width: min(260px, 46vw); padding: 10px 14px; }
            .dyn-popup.pop-panel h3 { font-size: 13px; }
            .dyn-popup.pop-panel p { font-size: 15px; }
            /* En pantallas angostas casi no sobra espacio a los lados del documento:
               se recorta el offset "hacia afuera" para que la tarjeta no se salga
               de la pantalla (mismo valor seguro que se usaba antes). */
            .dyn-popup.pop-panel.side-left { left: 2%; }
            .dyn-popup.pop-panel.side-right { right: 2%; }
        }

        @media (max-height: 650px) {
            .ui-container { bottom: max(8px, env(safe-area-inset-bottom)); }
            #subtitle-box { margin-bottom: 8px; padding: 8px 20px; min-height: 20px; }
            .scene { height: 68dvh; margin-top: 0; }
        }
    </style>
</head>
<body>

    <div class="scene" id="scene">

        <div id="intro-splash">
            <img src="../images/energki-logo.png" alt="Energki Logo" class="logo-splash">
            <p>Capacitación Técnica</p>
        </div>

    </div>

    <div class="ui-container">
        <div id="subtitle-box"><span class="k-word highlight">Presiona</span> <span class="k-word highlight">Play</span> <span class="k-word highlight">para</span> <span class="k-word highlight">Iniciar</span> <span class="k-word highlight">la</span> <span class="k-word highlight">Capacitación</span></div>
        
        <div class="controls-bar">
            <button class="ctrl-btn" id="btn-restart" title="Reiniciar al Inicio"><img class="ctrl-icon" src="../images/icon-restart-cy.png" alt=""></button>
            <button class="ctrl-btn" id="btn-prev" title="Regresar"><img class="ctrl-icon" src="../images/icon-prev-cy.png" alt=""></button>
            <button class="ctrl-btn" id="btn-play" title="Reproducir / Pausar"><img class="ctrl-icon" id="btn-play-icon" src="../images/icon-play-cy.png" alt=""></button>
            <button class="ctrl-btn" id="btn-next" title="Adelantar"><img class="ctrl-icon" src="../images/icon-next-cy.png" alt=""></button>
            <button class="ctrl-btn" id="btn-voice" title="Activar/Desactivar Voz"><img class="ctrl-icon" id="btn-voice-icon" src="../images/icon-sound-on-cy.png" alt=""></button>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const introSplash = document.getElementById('intro-splash'); 
        const subtitleBox = document.getElementById('subtitle-box');
        const btnPlay = document.getElementById('btn-play');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnRestart = document.getElementById('btn-restart');
        const btnVoice = document.getElementById('btn-voice');

        let currentStep = -1;
        let isPlaying = false;
        let autoPlayTimer = null;
        let voiceEnabled = true;
        let currentUtteranceId = 0;
        let currentWordData = [];
        // Fragmentos de voz (splitIntoSpeechChunks) del paso que se está narrando
        // ahora mismo, y en cuál va — persisten fuera de playCurrentStep() para
        // que silenciar/activar la voz A MEDIO diálogo (ver btnVoice más abajo)
        // pueda retomar desde el mismo fragmento en vez de reiniciar el paso
        // completo desde el principio.
        let currentStepChunks = null;
        let currentChunkIndex = 0;
        // A qué "currentStep" pertenecen currentStepChunks — Adelantar/Regresar
        // manual (showStepPreview) NO pasa por playCurrentStep(), así que
        // currentStepChunks puede quedar apuntando a un paso VIEJO mientras
        // currentStep ya cambió. Antes de retomar un fragmento a medias (mute o
        // resumir tras pausa) hay que confirmar que de verdad son del paso
        // actual — si no, tocaría retomar el texto equivocado.
        let currentStepChunksForStep = -1;

        // Bug conocido en navegadores Chromium: getVoices() puede regresar vacío
        // justo tras cargar la página porque las voces se cargan asíncronamente.
        // Se "calientan" aquí para que ya estén listas cuando el usuario dé Play.
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // Handlers reutilizables: los mismos elementos/CSS de la demo original,
        // referenciables por id tanto desde el guion fijo como desde datos cargados por API.
        const namedPanels = {
            'intro-splash': {
                activate: () => { scene.classList.add('splash-active'); introSplash.classList.add('active'); },
                deactivate: () => { scene.classList.remove('splash-active'); introSplash.classList.remove('active'); }
            },
            'portada-3d': {
                activate: () => {
                    scene.classList.remove('splash-active');
                    introSplash.classList.remove('active');
                    // La inclinación de un manual con páginas genéricas la maneja
                    // el ciclo de 3 posiciones por página (ver renderStep/
                    // goNextAuto más abajo) — no aquí, porque esto se activa
                    // durante el objetivo, que debe quedarse PLANO (posición 1).
                    // La demo original (sin escenario dinámico) se sigue
                    // inclinando aquí, como siempre.
                    if (!usingDynamicStage) scene.classList.add('is-3d');
                },
                deactivate: () => {
                    if (!usingDynamicStage) scene.classList.remove('is-3d');
                    scene.classList.add('splash-active');
                    introSplash.classList.add('active');
                }
            }
        };
        const noop = () => {};

        // Estos 3 pasos son el único "guion" fijo que le queda al archivo — sirven
        // de red por si alguien abre viewer.html sin ningún manual real (sin "id",
        // o con el id de la demo vieja): un fallback mínimo, no un manual de
        // verdad. Cualquier manual real trae su propio guion desde la API (ver
        // applyEditorData) y estos tres ni se usan (se vacían antes).
        const steps = [
            { text: "Hola, les doy la bienvenida. Soy Mateo, su instructor virtual en Energki Robotics.", activate: namedPanels['intro-splash'].activate, deactivate: namedPanels['intro-splash'].deactivate },
            { text: "El objetivo de este curso es desarrollar las habilidades necesarias para entender e interpretar de manera segura un diagrama eléctrico.", activate: namedPanels['intro-splash'].activate, deactivate: noop },
            { text: "Comencemos. Abre un manual desde el dashboard para empezar una capacitación de verdad.", activate: namedPanels['portada-3d'].activate, deactivate: namedPanels['portada-3d'].deactivate }
        ];

        // Un manual cargado por id (fuera de la demo original) empieza limpio,
        // sin esperar los pasos fijos de Clevertech.
        const LEGACY_DEMO_ID = 'clevertech-demo';
        const trainingId = new URLSearchParams(location.search).get('id');
        if (trainingId && trainingId !== LEGACY_DEMO_ID) {
            steps.length = 0;
            // Mientras carga (fetch a la API), "steps" está vacío: si alguien le da
            // Play antes de que termine (internet lento, Apps Script tardado), truena
            // con "Cannot read properties of undefined" porque steps[0] no existe
            // todavía. Se deshabilitan los controles hasta que la carga termine bien
            // (ver cargarManualPorId, más abajo).
            [btnPlay, btnPrev, btnNext, btnRestart].forEach(b => b.disabled = true);
        }

        // Pasos originales; los que llegan del editor/API se agregan después de este índice.
        const baseStepsCount = steps.length;

        // Solo se activa cuando el manual cargado trae paneles con id nuevo (no reconocido);
        // en ese caso se oculta el documento/paneles originales y se usa el escenario genérico.
        let usingDynamicStage = false;

        function renderStep(targetIndex) {
            // Si el paso al que se va pertenece a OTRA página genérica que la que
            // está armada en pantalla ahora mismo, se cambia primero — antes de
            // repetir las activaciones de abajo. Los pasos de páginas anteriores,
            // al repetirse en ese ciclo (activate() cumulativo desde el 0), ya no
            // hacen nada (sus pines/tarjetas ya no existen: se reconstruyeron para
            // la nueva página) — está bien así, solo importa que el panel del paso
            // ACTUAL quede activo al final. Ver renderPaginaDinamica más abajo.
            if (targetIndex >= 0) {
                const targetPage = pageIndexForStep(targetIndex);
                if (targetPage !== null && targetPage !== activeDynPageIndex) {
                    renderPaginaDinamica(targetPage);
                }
                // is-3d del escenario genérico: inclinado mientras se narre un
                // PUNTO de alguna página; plano en cualquier otro paso (bienvenida,
                // objetivo, o el "contexto" propio de una página — Posición 1, ver
                // stepWantsTilt). Autoritativo: corrige el estado sin importar
                // cómo se llegó aquí (Play automático, Adelantar/Regresar manual,
                // o stepForward, que además inserta una pausa/narra el contexto
                // ANTES de llamar renderStep al cruzar de página — ver más abajo).
                const wantsTilt = stepWantsTilt(targetIndex);
                scene.classList.toggle('is-3d', wantsTilt);
                dynTiltActive = wantsTilt;
            } else {
                scene.classList.remove('is-3d');
                dynTiltActive = false;
            }

            steps.forEach(s => s.deactivate());

            for(let i = 0; i <= targetIndex; i++) {
                if(i >= 0 && steps[i]) steps[i].activate();
            }

            scene.classList.toggle('dynamic-active', usingDynamicStage && targetIndex >= baseStepsCount);

            // El texto de un paso real (targetIndex >= 0) lo pinta quien llame a
            // renderStep: playCurrentStep() al reproducir (con su propio paginado
            // sincronizado a la voz), o showStepPreview() al navegar manual con
            // Adelantar/Regresar (ver más abajo) — así nunca se ve el guion
            // completo de golpe, solo el "montón de palabras" que se quería evitar.
            if (targetIndex < 0) {
                subtitleBox.innerHTML = '<span class="k-word highlight">Presiona</span> <span class="k-word highlight">Play</span> <span class="k-word highlight">para</span> <span class="k-word highlight">Iniciar</span> <span class="k-word highlight">la</span> <span class="k-word highlight">Capacitación</span>';
            }
        }

        // Vista rápida de un paso al navegar manualmente (Adelantar/Regresar): solo
        // la primera "página" de ~2 líneas, ya resaltada (no hay audio en curso con
        // el que sincronizar el resaltado progresivo).
        function showStepPreview(index) {
            if (index < 0 || index >= steps.length) return;
            const pages = groupIntoPages(buildWordList(steps[index].text));
            renderWordPage(pages[0]);
            currentWordData.forEach(wd => {
                let el = document.getElementById(wd.id);
                if (el) el.classList.add('highlight');
            });
        }

        // Fragmentos para el motor de VOZ: se prefiere cortar entre oraciones
        // completas y grandes (hasta 180 caracteres), para que la narración se
        // escuche natural y evitar el bug conocido de Chrome que corta el audio
        // cuando un solo utterance es muy largo. Esto NO define cuánto texto se
        // ve en el subtítulo — eso lo maneja el paginado visual de abajo — así
        // que partir por oración aquí no hace pausas raras a media frase.
        function splitIntoSpeechChunks(text) {
            const sentences = text.match(/[^.!?¡¿]+[.!?]+(\s+|$)|[^.!?¡¿]+$/g) || [text];
            const chunks = [];
            let current = '';
            sentences.forEach(s => {
                if (current && (current + s).length > 180) {
                    chunks.push(current);
                    current = s;
                } else {
                    current += s;
                }
            });
            if (current.trim()) chunks.push(current);
            return chunks;
        }

        // Paginado VISUAL del subtítulo: agrupa las palabras de un fragmento de
        // voz en páginas de ~2 líneas. No necesita respetar límites de oración
        // (no afecta cómo se habla, la voz sigue leyendo el fragmento de corrido);
        // solo decide cuándo "pasar la página" del cuadro de subtítulos mientras
        // el audio avanza (ver onboundary más abajo).
        const SUBTITLE_MAX_WORDS = 14; // ≈ 2 líneas del subtítulo en la mayoría de los casos
        function buildWordList(text) {
            const words = [];
            let charCount = 0;
            text.split(' ').forEach(w => {
                if (w) words.push({ text: w, start: charCount });
                charCount += w.length + 1;
            });
            return words;
        }
        function groupIntoPages(words) {
            const pages = [];
            for (let i = 0; i < words.length; i += SUBTITLE_MAX_WORDS) {
                pages.push(words.slice(i, i + SUBTITLE_MAX_WORDS));
            }
            return pages.length ? pages : [[]];
        }
        function renderWordPage(pageWords) {
            let html = '';
            currentWordData = [];
            pageWords.forEach((w, i) => {
                html += `<span id="kw-${i}" class="k-word">${w.text}</span> `;
                currentWordData.push({ id: `kw-${i}`, start: w.start });
            });
            subtitleBox.innerHTML = html;
        }

        let voiceWarningShown = false;
        function pickSpanishVoice() {
            const voices = window.speechSynthesis.getVoices();
            if (!voices.length) {
                if (!voiceWarningShown) {
                    voiceWarningShown = true;
                    console.warn('[voz] No hay voces de síntesis disponibles. Si usas Brave, abre el ícono de Shields (león) en la barra de direcciones y baja "Bloqueo de huella digital" a Estándar para este sitio.');
                }
                return null;
            }
            return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('es')) || null;
        }

        // Otro bug conocido de Chrome: si una narración sigue hablando más de
        // ~15 segundos seguidos, el motor de voz se detiene solo a media frase
        // (se "come" el resto). pause()+resume() de golpe cada pocos segundos
        // evita que llegue a ese límite — no se nota ninguna pausa real, es
        // instantáneo. No hace nada si no hay nada sonando en ese momento.
        if ('speechSynthesis' in window) {
            setInterval(() => {
                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.pause();
                    window.speechSynthesis.resume();
                }
            }, 10000);
        }

        // Habla currentStepChunks[currentChunkIndex] y sigue con los que faltan
        // del paso — separado de playCurrentStep() para que un cambio de volumen
        // a medio diálogo (ver toggleVoiceMuted) pueda retomar desde el MISMO
        // fragmento en el que iba, sin reiniciar currentChunkIndex a 0.
        function speakChunkAt(myUtteranceId) {
            if (myUtteranceId !== currentUtteranceId || !isPlaying) return;
            const chunks = currentStepChunks;
            if (!chunks || currentChunkIndex >= chunks.length) {
                currentWordData.forEach(wd => {
                    let el = document.getElementById(wd.id);
                    if (el) el.classList.add('highlight');
                });
                autoPlayTimer = setTimeout(() => {
                    if (isPlaying) goNextAuto();
                }, 1000);
                return;
            }

            // La voz lee el fragmento COMPLETO de corrido (sin pausas
            // artificiales); el subtítulo va pasando de página sin que
            // eso afecte el audio (ver onboundary).
            const chunk = chunks[currentChunkIndex];
            const pages = groupIntoPages(buildWordList(chunk));
            let pageIndex = 0;
            renderWordPage(pages[0]);

            const utterance = new SpeechSynthesisUtterance(chunk);
            utterance.lang = 'es-MX';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            // Silenciado: sigue "hablando" (mismo timing real de
            // onboundary, mismo resaltado de subtítulos) pero sin sonido.
            utterance.volume = voiceEnabled ? 1 : 0;
            const spanishVoice = pickSpanishVoice();
            if (spanishVoice) utterance.voice = spanishVoice;

            utterance.onboundary = (event) => {
                if (event.name === 'word' && isPlaying && myUtteranceId === currentUtteranceId) {
                    const cIndex = event.charIndex;
                    while (pages[pageIndex + 1] && pages[pageIndex + 1].length && cIndex >= pages[pageIndex + 1][0].start) {
                        pageIndex++;
                        renderWordPage(pages[pageIndex]);
                    }
                    currentWordData.forEach(wd => {
                        if (cIndex >= wd.start - 1) {
                            let el = document.getElementById(wd.id);
                            if (el) el.classList.add('highlight');
                        }
                    });
                }
            };

            utterance.onend = () => {
                if (myUtteranceId !== currentUtteranceId || !isPlaying) return;
                currentChunkIndex++;
                speakChunkAt(myUtteranceId);
            };

            window.speechSynthesis.speak(utterance);
        }

        function playCurrentStep() {
            if (currentStep < 0 || currentStep >= steps.length) return;

            const text = steps[currentStep].text;
            currentUtteranceId++;
            let myUtteranceId = currentUtteranceId;

            clearTimeout(autoPlayTimer);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            // Se usa el motor de voz SIEMPRE que el navegador lo soporte y haya
            // texto — con voiceEnabled=false igual, pero mudo (utterance.volume=0
            // más abajo). Así el resaltado de subtítulos palabra por palabra
            // (onboundary) sigue el mismo ritmo real que tendría hablado, en vez
            // de una aproximación por tiempo — silenciar debe cambiar solo el
            // audio, no el "como si estuviera hablando" del texto.
            if ('speechSynthesis' in window && text) {
                currentStepChunks = splitIntoSpeechChunks(text);
                currentChunkIndex = 0;
                currentStepChunksForStep = currentStep;

                // Chrome a veces "traga" el inicio de la narración si speak() se
                // llama en el mismo instante que cancel() (el motor de voz
                // todavía no soltó del todo la utterance anterior) — el fragmento
                // arranca a medias o se pierde en silencio, y como los fragmentos
                // siguientes SÍ suenan bien, se oía como si solo dijera el final
                // del texto. Un respiro corto entre cancel() y el primer speak()
                // le da tiempo al motor a quedar listo de verdad. myUtteranceId ya
                // protege este delay: si para cuando corre ya se pasó de paso, no
                // hace nada.
                setTimeout(() => speakChunkAt(myUtteranceId), 120);
            } else {
                currentStepChunks = null;
                currentStepChunksForStep = -1;
                if (voiceEnabled && !('speechSynthesis' in window) && !voiceWarningShown) {
                    voiceWarningShown = true;
                    console.warn('[voz] Este navegador/dispositivo no soporta síntesis de voz (window.speechSynthesis no existe). La capacitación seguirá avanzando por tiempo, pero sin narración.');
                }

                // Sin voz no hay onboundary que avise el avance real, así que aquí
                // sí se pagina con un temporizador proporcional al texto de cada
                // página (no hay audio que unificar, así que no hay pausas que evitar).
                const pages = groupIntoPages(buildWordList(text));
                let pageIndex = 0;
                const showNextPage = () => {
                    if (myUtteranceId !== currentUtteranceId || !isPlaying) return;
                    if (pageIndex >= pages.length) {
                        autoPlayTimer = setTimeout(() => {
                            if (isPlaying) goNextAuto();
                        }, 800);
                        return;
                    }

                    const page = pages[pageIndex++];
                    renderWordPage(page);
                    currentWordData.forEach(wd => {
                        let el = document.getElementById(wd.id);
                        if (el) el.classList.add('highlight');
                    });

                    const pageText = page.map(w => w.text).join(' ');
                    const readingTime = (pageText.length * 70) + 900;
                    autoPlayTimer = setTimeout(showNextPage, readingTime);
                };

                showNextPage();
            }
        }

        // Retoma la narración desde donde iba (currentChunkIndex de
        // currentStepChunks) en vez de reiniciar el paso completo desde cero —
        // usado tanto al cambiar mute/unmute a medio diálogo como al reanudar
        // con Play después de una pausa real. Si currentStepChunks no
        // corresponde al paso actual (por ejemplo, se navegó manualmente con
        // Adelantar/Regresar mientras estaba pausado, lo que no pasa por
        // playCurrentStep) cae de vuelta a playCurrentStep(), que arma todo de
        // nuevo para el paso correcto.
        function resumeSpeechFromCurrentChunk() {
            if (!('speechSynthesis' in window) || !currentStepChunks || currentStepChunksForStep !== currentStep) {
                playCurrentStep();
                return;
            }
            window.speechSynthesis.cancel();
            clearTimeout(autoPlayTimer);
            currentUtteranceId++;
            const myUtteranceId = currentUtteranceId;
            setTimeout(() => speakChunkAt(myUtteranceId), 120);
        }

        // Cuánto se ve el documento plano (sin tarjetas) antes de inclinarse —
        // el "momento para que el usuario vea la imagen" pedido. Ver stepForward.
        const PAGE_TRANSITION_PAUSE_MS = 1800;
        // Debe coincidir con la transición de .dyn-doc/#dynamic-stage (2s): el
        // punto no debe aparecer AL MISMO TIEMPO que se inclina, sino hasta que
        // termine de inclinarse.
        const TILT_MS = 2000;

        // Ciclo de 3 posiciones por página (plana -> inclinada -> aparece el
        // punto): cada AVANCE —un clic de Adelantar, o un tic del reproductor
        // automático— muestra UNA posición a la vez, no las tres de un jalón
        // (así lo pidieron). dynPendingPhase lleva la cuenta:
        //   null    = nada pendiente, avance normal de un paso.
        //   'flat'  = ya se cambió/mostró la imagen plana, falta inclinarla.
        //   'tilted'= ya se inclinó, falta prender el primer punto (dynPendingIndex).
        // Solo Adelantar/Play pasan por este ciclo; Regresar salta directo (ver
        // goPrev) — no se pidió una versión "al revés" de la animación.
        let dynPendingPhase = null;
        let dynPendingIndex = null;

        // isAuto=true: se llama sola por temporizador (Play). isAuto=false: la
        // llama un clic de Adelantar, avanza una sola posición y se detiene ahí.
        function stepForward(isAuto) {
            if (dynPendingPhase === 'flat') {
                scene.classList.add('is-3d');
                dynTiltActive = true;
                dynPendingPhase = 'tilted';
                if (isAuto) {
                    clearTimeout(autoPlayTimer);
                    autoPlayTimer = setTimeout(() => { if (isPlaying) stepForward(true); }, TILT_MS);
                }
                return;
            }
            if (dynPendingPhase === 'tilted') {
                currentStep = dynPendingIndex;
                dynPendingPhase = null;
                dynPendingIndex = null;
                renderStep(currentStep); // ya inclinado: esto prende el punto correcto
                if (isAuto) playCurrentStep(); else showStepPreview(currentStep);
                return;
            }

            // Sin transición pendiente: avance normal de un paso. Esto corre
            // IGUAL en automático (Play) que manual (un clic más de Adelantar
            // ya en el último paso) — antes solo pasaba algo aquí si isAuto,
            // así que Adelantar manualmente hasta el final se quedaba tal cual
            // (inclinado, con todas las tarjetas encimadas) sin ningún aviso.
            if (currentStep >= steps.length - 1) {
                pause();
                // No dejar la última página inclinada con todas sus tarjetas
                // encimadas al terminar — se ve tronado. Las páginas de en
                // medio ya vuelven solas a plano al cruzar a la siguiente (ver
                // más arriba); la ÚLTIMA nunca tiene un "siguiente" que
                // dispare esa misma limpieza, así que se hace aquí. Este punto
                // solo se alcanza cuando ya no queda NINGÚN paso más de
                // NINGUNA página, así que la que se esté mostrando aquí es
                // siempre la última del manual (aplica igual si el manual
                // completo es de una sola página).
                if (dynTiltActive) {
                    scene.classList.remove('is-3d');
                    dynTiltActive = false;
                    Object.values(panelEls).forEach(p => p.deactivate());
                }
                subtitleBox.innerHTML = '<span class="k-word highlight">Módulo</span> <span class="k-word highlight">1</span> <span class="k-word highlight">Completado.</span> <span class="k-word highlight">(Usa</span> <span class="k-word highlight">Regresar</span> <span class="k-word highlight">o</span> <span class="k-word highlight">Reiniciar)</span>';
                return;
            }

            const nextIndex = currentStep + 1;
            const nextPage = pageIndexForStep(nextIndex);
            const nextWantsTilt = stepWantsTilt(nextIndex);

            // El paso que sigue es el "contexto" de una página (plano, con su
            // propia narración) — se muestra como un paso normal más, sin pausa
            // fija: dura lo que dure narrarlo, igual que el objetivo de la
            // página 1. La inclinación llega después, con el primer punto.
            if (nextPage !== null && !nextWantsTilt) {
                if (dynTiltActive) {
                    scene.classList.remove('is-3d');
                    dynTiltActive = false;
                    Object.values(panelEls).forEach(p => p.deactivate());
                    subtitleBox.innerHTML = '';
                }
                if (nextPage !== activeDynPageIndex) renderPaginaDinamica(nextPage);
                scene.classList.toggle('dynamic-active', usingDynamicStage);
                currentStep = nextIndex;
                renderStep(currentStep); // deja is-3d apagado (stepWantsTilt es false para este paso)
                if (isAuto) playCurrentStep(); else showStepPreview(currentStep);
                return;
            }

            // Aplica solo cuando el paso que sigue es un PUNTO (se inclina) Y
            // (todavía no estábamos inclinados —primera vez, o justo se vio el
            // contexto de esta misma página—, O es un cruce DE VERAS a otra
            // página distinta). Entre dos puntos de la MISMA página (ya
            // inclinada) esto no debe dispararse.
            const needsTransition = nextPage !== null && (!dynTiltActive || nextPage !== activeDynPageIndex);

            if (needsTransition) {
                // Ya se vio la Posición 1 de esta página (su "contexto", o el
                // objetivo si es la página 1) — no hace falta la pausa fija de
                // nuevo, se pasa directo a inclinar.
                const alreadyOnPage = nextPage === activeDynPageIndex;

                // Posición 3 de la página que se deja (si veníamos inclinados de
                // otra): vuelve a plano, se apagan SOLO sus tarjetas (no todos los
                // pasos — eso incluía al que quita el logo, y lo volvía a mostrar
                // por error).
                if (dynTiltActive) {
                    scene.classList.remove('is-3d');
                    dynTiltActive = false;
                    Object.values(panelEls).forEach(p => p.deactivate());
                    subtitleBox.innerHTML = ''; // no dejar el texto del último punto "pegado" mientras se ve la imagen sola
                }
                // Posición 1 de la nueva página (si no se había mostrado ya vía
                // su contexto): cambia la imagen ya, se ve plana.
                if (!alreadyOnPage) renderPaginaDinamica(nextPage);
                scene.classList.toggle('dynamic-active', usingDynamicStage);

                dynPendingIndex = nextIndex;
                dynPendingPhase = 'flat';

                if (alreadyOnPage) {
                    // La Posición 1 ya se vio (contexto/objetivo) — se consume esa
                    // fase de inmediato, sin esperar, y se pasa a inclinar.
                    stepForward(isAuto);
                    return;
                }

                if (isAuto) {
                    clearTimeout(autoPlayTimer);
                    autoPlayTimer = setTimeout(() => { if (isPlaying) stepForward(true); }, PAGE_TRANSITION_PAUSE_MS);
                }
                return;
            }

            currentStep = nextIndex;
            renderStep(currentStep);
            if (isAuto) playCurrentStep(); else showStepPreview(currentStep);
        }

        function goNextAuto() {
            stepForward(true);
        }

        const btnVoiceIcon = document.getElementById('btn-voice-icon');
        const btnPlayIcon = document.getElementById('btn-play-icon');

        const PAUSE_ICON_SVG = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="5" y="3" width="5" height="18" fill="%2300f0ff"/><rect x="14" y="3" width="5" height="18" fill="%2300f0ff"/></svg>';

        btnVoice.addEventListener('click', () => {
            voiceEnabled = !voiceEnabled;
            btnVoiceIcon.src = voiceEnabled ? '../images/icon-sound-on-cy.png' : '../images/icon-sound-off-cy.png';
            if (!('speechSynthesis' in window)) return;

            if (!isPlaying || currentStep < 0 || dynPendingPhase) {
                // dynPendingPhase: a medio ciclo de 3 posiciones (imagen plana o
                // ya inclinada, pero SIN narración activa todavía) no hay nada
                // que retomar. Si se llamara resumeSpeechFromCurrentChunk aquí,
                // su temporizador de 1000ms (el de "ya terminé de hablar, paso
                // al siguiente") reemplazaría al de TILT_MS/PAGE_TRANSITION_PAUSE_MS
                // que stepForward ya dejó armado — calibrado para durar lo mismo
                // que la animación CSS de inclinación — adelantando el punto
                // antes de que la imagen termine de inclinarse en pantalla. El
                // siguiente avance ya toma el voiceEnabled actualizado por su
                // cuenta, así que aquí solo hace falta cancelar cualquier resto
                // de audio (normalmente no hay ninguno en este momento).
                window.speechSynthesis.cancel();
                return;
            }

            // El motor de voz no deja cambiar el volumen de un audio que ya está
            // sonando (hay que cancelar y volver a mandar speak()), así que
            // cambiar mute/unmute A MEDIO diálogo siempre "salta" al inicio de
            // ALGO — antes ese algo era el paso completo (playCurrentStep lo
            // reinicia todo desde cero), lo que se sentía como que reiniciaba la
            // narración entera. resumeSpeechFromCurrentChunk() retoma desde el
            // fragmento en el que iba en vez de todo el diálogo.
            resumeSpeechFromCurrentChunk();
        });

        function play() {
            if (currentStep === steps.length - 1 && !dynPendingPhase) currentStep = -1;
            isPlaying = true;
            btnPlayIcon.src = PAUSE_ICON_SVG;

            if (currentStep === -1) {
                currentStep = 0;
                renderStep(currentStep);
                playCurrentStep();
                return;
            }

            // Si se pausó a medio ciclo de 3 posiciones (plana o ya inclinada
            // pero sin el punto todavía), seguir desde ahí — no renarrar el
            // punto anterior de la nada. Si no, se reanuda el mismo diálogo
            // donde iba (resumeSpeechFromCurrentChunk) en vez de reiniciarlo
            // desde el principio — antes, Pausa -> Play SIEMPRE volvía al
            // inicio del paso, lo que también se sentía como el mismo bug al
            // combinarlo con mute/unmute a medio diálogo.
            if (dynPendingPhase) stepForward(true); else resumeSpeechFromCurrentChunk();
        }

        function pause() {
            isPlaying = false;
            btnPlayIcon.src = '../images/icon-play-cy.png';
            clearTimeout(autoPlayTimer);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            currentUtteranceId++;
        }

        function togglePlay() {
            isPlaying ? pause() : play();
        }

        function goNext() {
            pause();
            stepForward(false); // un clic = una posición (plana / inclinada / punto), ver stepForward
        }

        function goPrev() {
            pause();
            // Regresar no tiene la versión "al revés" del ciclo de 3 posiciones
            // (no se pidió) — salta directo al paso anterior, con la inclinación
            // que le corresponda (renderStep ya decide eso solo). Se descarta
            // cualquier transición a medias para no dejar un estado raro.
            dynPendingPhase = null;
            dynPendingIndex = null;
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
                showStepPreview(currentStep);
            } else if (currentStep === 0) {
                resetPresentation();
            }
        }

        function resetPresentation() {
            pause();
            dynPendingPhase = null;
            dynPendingIndex = null;
            currentStep = -1;
            // Si ya se había avanzado a otra página antes de reiniciar, sin esto
            // la imagen dinámica se quedaba mostrando la ÚLTIMA página vista (la
            // 2, la 3...) durante toda la introducción del reinicio — el
            // escenario dinámico se hace visible desde el primer paso
            // (bienvenida), no solo al llegar a un punto real, así que esa
            // imagen vieja se alcanzaba a ver antes de "corregirse sola" al
            // llegar de nuevo a la página 1. Se regresa a la primera página con
            // contenido de una vez, para que ya esté bien desde el inicio.
            if (usingDynamicStage) {
                const firstIndexWithContent = customPaginas.findIndex(pg => pg.paneles.length > 0);
                if (firstIndexWithContent >= 0) renderPaginaDinamica(firstIndexWithContent);
            }
            renderStep(currentStep);
        }

        btnPlay.addEventListener('click', togglePlay);
        btnNext.addEventListener('click', goNext);
        btnPrev.addEventListener('click', goPrev);
        btnRestart.addEventListener('click', resetPresentation);

        // --- Recepción de datos desde el editor (editor.html) ---

        // IMPORTANTE: el marco del documento (#dynamic-stage) se mantiene SIEMPRE
        // en proporción fija 1.4:1. El giro 3D (rotateX/rotateZ/translateZ) está
        // calibrado exactamente para esa forma;
        // si el marco cambiara de proporción según cada imagen, el mismo giro fijo
        // deformaría visualmente el rectángulo (se ve "achocado"/aplastado), aunque
        // la imagen en sí no se distorsione. Por eso NO se toca el aspect-ratio del
        // marco: la imagen se ajusta adentro con background-size/object-fit "contain",
        // que la muestra completa y sin recortes ni estiramientos, centrada dentro
        // del marco fijo (puede dejar una franja vacía si la proporción no coincide,
        // pero nunca deforma ni recorta el contenido).

        function toPercent(value) {
            if (typeof value === 'string') return value.endsWith('%') ? value : value + '%';
            return value + '%';
        }

        function ensureDynamicStage() {
            let stage = document.getElementById('dynamic-stage');
            if (!stage) {
                // #dynamic-stage tiene "transform-style: preserve-3d" (para que el
                // documento se incline). Las tarjetas/líneas NO deben vivir adentro:
                // al compartir ese mismo espacio 3D, el navegador las ordena por
                // profundidad real (Z), y el documento (más "cerca" por su
                // translateZ) las tapaba aunque tuvieran opacity:1. Por eso viven en
                // #dynamic-overlay-root aparte, con el mismo tamaño/posición pero
                // sin heredar ese contexto 3D — así siempre quedan encima.
                stage = document.createElement('div');
                stage.id = 'dynamic-stage';
                stage.innerHTML = `<div class="dyn-doc"><img id="dynamic-image" alt="Panel del manual"></div>`;
                scene.appendChild(stage);

                const overlayRoot = document.createElement('div');
                overlayRoot.id = 'dynamic-overlay-root';
                overlayRoot.innerHTML = `
                    <div class="dyn-overlay" id="dyn-overlay"></div>
                    <svg class="dyn-overlay-svg" id="dyn-overlay-svg"></svg>
                `;
                // Fuera de .scene por completo: .scene TAMBIÉN tiene su propio
                // transform-style:preserve-3d (lo necesita el ejemplo original), así
                // que quedarse adentro (aunque fuera de #dynamic-stage) seguía
                // compartiendo profundidad 3D con el documento. Afuera, no.
                document.body.appendChild(overlayRoot);
                syncOverlayRootRect(); // de inmediato: layoutDynPopups necesita el tamaño ya listo
            }
            return stage;
        }

        // Decide en qué costado (izquierda/derecha) va la tarjeta de cada punto,
        // según de qué lado de la imagen esté su origen. El acomodo vertical (para
        // que no se encimen) se hace una sola vez en layoutDynPopups, más abajo.
        function sidePanelesFor(paneles) {
            const sideOf = {};
            paneles.forEach(panel => { sideOf[panel.id] = parseFloat(panel.origen.x) < 50 ? 'left' : 'right'; });
            return sideOf;
        }

        function renderPopupContent(panel) {
            let html = `<h3>${panel.titulo || panel.id}</h3>`;
            if (panel.resumen) html += `<p>${panel.resumen}</p>`;
            if (Array.isArray(panel.campos) && panel.campos.length) {
                // Si algún campo trae color, es una leyenda tipo "código de colores": el
                // valor suele ser una frase larga y necesita fluir como texto, no pelear
                // por espacio en una rejilla de 2 columnas (ver nota de .data-list arriba).
                const hasSwatches = panel.campos.some(c => c.color);
                if (hasSwatches) {
                    html += '<div class="data-list">';
                    panel.campos.forEach(c => {
                        const swatch = `<span class="campo-swatch" style="background:${c.color || 'transparent'}; ${c.color ? '' : 'border-color:transparent;'}"></span>`;
                        html += `<div class="campo-row">${swatch}<span><b>${c.label}:</b> ${c.valor}</span></div>`;
                    });
                    html += '</div>';
                } else {
                    html += '<div class="data-grid">';
                    panel.campos.forEach(c => {
                        html += `<div>${c.label}</div><div>${c.valor}</div>`;
                    });
                    html += '</div>';
                }
            } else if (!panel.resumen && panel.narrativa) {
                html += `<p style="font-size: 14px; font-weight: normal; color: #ccc;">${panel.narrativa}</p>`;
            }
            return html;
        }

        // Parejas {pin, line} de los puntos dinámicos: el pin vive dentro del
        // documento inclinado, la línea vive en la capa plana. syncDynLines (más
        // abajo) lee la posición real del pin en pantalla (ya proyectada en 3D por
        // el navegador) y se la pasa a la línea, para que su extremo siempre toque
        // el punto correcto sin importar el ángulo actual del documento.
        const dynItems = [];

        // --- Varias páginas (varias imágenes) por manual ---
        //
        // Solo existe UN escenario dinámico en pantalla a la vez (#dynamic-stage,
        // ver ensureDynamicStage) — al pasar de página se reconstruyen sus pines/
        // tarjetas/líneas para la nueva, no se crean escenarios nuevos.
        //
        // customPaginas: por cada página del manual, sus paneles "genéricos" (id
        // no reconocido) — los "named" (intro-splash/portada-3d) siguen aparte,
        // ninguno vive en una página.
        let customPaginas = [];
        // Qué página está actualmente construida en el DOM (-1 = ninguna aún).
        let activeDynPageIndex = -1;
        // Si el documento genérico está inclinado (Posición 2) ahora mismo — lo
        // controla renderStep()/goNextAuto() (ciclo de 3 posiciones por página:
        // plano -> inclinado con puntos -> plano de nuevo antes de la siguiente
        // página), no 'portada-3d' (que solo se usa para la demo original).
        let dynTiltActive = false;
        // { [panelId]: índice de página } — para saber a qué página saltar ANTES
        // de reproducir el paso de un panel que está en otra página.
        let panelPageIndex = {};
        // Activate/deactivate de los paneles genéricos de la página actualmente
        // construida — se reconstruye en cada renderPaginaDinamica(). Viven aquí
        // (no dentro de applyEditorData) para que sigan siendo la MISMA función
        // que ya quedó guardada en cada paso de "steps" (los pasos se arman una
        // sola vez; lo que cambia con cada página es a qué apunta panelEls).
        let panelEls = {};
        function activatePanel(id) {
            if (namedPanels[id]) namedPanels[id].activate();
            else if (panelEls[id]) panelEls[id].activate();
        }
        function deactivatePanel(id) {
            if (namedPanels[id]) namedPanels[id].deactivate();
            else if (panelEls[id]) panelEls[id].deactivate();
        }
        // A qué página pertenece el paso "index" (según los paneles genéricos que
        // menciona) — null si es un paso de la demo original (paneles "named",
        // que no viven en ninguna página) y por lo tanto no debe disparar cambio
        // de página.
        function pageIndexForStep(index) {
            const step = steps[index];
            if (!step) return null;
            // Paso de "contexto" de página (editor.html: ensurePaginaContextSteps/
            // buildAutoSteps): plano, no tiene panelIds propios — su página va
            // marcada directo en pageFlat.
            if (typeof step.pageFlat === 'number') return step.pageFlat;
            if (!step.panelIds) return null;
            for (const id of step.panelIds) {
                if (Object.prototype.hasOwnProperty.call(panelPageIndex, id)) return panelPageIndex[id];
            }
            return null;
        }

        // A diferencia de pageIndexForStep (¿a qué página pertenece, para saber
        // si hay que cambiar la imagen?), esto dice si ESE paso en particular debe
        // verse inclinado. Un punto normal sí; el "contexto" de una página (plano,
        // con su propia narración, antes de inclinarse) no.
        function stepWantsTilt(index) {
            const step = steps[index];
            return !!(step && typeof step.pageFlat !== 'number' && pageIndexForStep(index) !== null);
        }

        // Solo la línea necesita seguimiento constante (el pin se mueve todo el
        // tiempo que dura el giro hacia la portada). La posición de las tarjetas
        // NO depende del instante actual —el giro 3D siempre es el mismo (ver
        // rotateX/rotateZ fijos más arriba)—, así que se calcula una sola vez, ver
        // layoutDynPopups más abajo. Separar las dos cosas evita que un problema en
        // una rompa a la otra.
        // #dynamic-overlay-root vive fuera de .scene (ver por qué en
        // ensureDynamicStage), así que su tamaño/posición/visibilidad ya no los pone
        // el CSS normal — se copian aquí, del rectángulo real de #dynamic-stage (el
        // marco, que no gira; solo .dyn-doc adentro gira). Se llama una vez de
        // inmediato al crear el escenario (layoutDynPopups necesita el tamaño ya
        // listo) y luego en cada cuadro desde syncDynLines para que seguir moviéndose
        // bien si la ventana cambia de tamaño.
        function syncOverlayRootRect() {
            const overlayRootEl = document.getElementById('dynamic-overlay-root');
            const stageEl = document.getElementById('dynamic-stage');
            if (overlayRootEl && stageEl) {
                const stageRect = stageEl.getBoundingClientRect();
                overlayRootEl.style.top = stageRect.top + 'px';
                overlayRootEl.style.left = stageRect.left + 'px';
                overlayRootEl.style.width = stageRect.width + 'px';
                overlayRootEl.style.height = stageRect.height + 'px';
                overlayRootEl.classList.toggle('is-visible', scene.classList.contains('dynamic-active'));
            }
        }

        function syncDynLines() {
            syncOverlayRootRect();

            if (dynItems.length) {
                const overlayEl = document.getElementById('dyn-overlay');
                const overlayRect = overlayEl && overlayEl.getBoundingClientRect();
                if (overlayRect && overlayRect.width && overlayRect.height) {
                    dynItems.forEach(({ pin, line }) => {
                        try {
                            const pinRect = pin.getBoundingClientRect();
                            const xPct = ((pinRect.left + pinRect.width / 2 - overlayRect.left) / overlayRect.width) * 100;
                            const yPct = ((pinRect.top + pinRect.height / 2 - overlayRect.top) / overlayRect.height) * 100;
                            if (isFinite(xPct) && isFinite(yPct)) {
                                line.setAttribute('x1', xPct + '%');
                                line.setAttribute('y1', yPct + '%');
                            }
                        } catch (e) { /* si un punto falla, que no tumbe a los demás */ }
                    });
                }
            }
            requestAnimationFrame(syncDynLines);
        }
        requestAnimationFrame(syncDynLines);

        // Dado un eje donde el % se convierte a píxeles como
        // "mapStart + (%/100)*mapSize", devuelve el rango de % permitido para que
        // el CENTRO de algo (con mitad de tamaño halfSize) quede dentro de
        // [safeMin, safeMax] con un margen. Si el hueco seguro es más chico que la
        // propia cosa, colapsa al punto medio en vez de invertir el rango. (Mismo
        // helper que usa el editor — no hay forma de compartir JS entre estos
        // archivos sueltos, así que va duplicado.)
        function pctRangeForSafety(mapStart, mapSize, safeMin, safeMax, halfSize, margin) {
            if (!mapSize) return [0, 0];
            let lo = safeMin + margin + halfSize;
            let hi = safeMax - margin - halfSize;
            if (lo > hi) { lo = hi = (safeMin + safeMax) / 2; }
            return [((lo - mapStart) / mapSize) * 100, ((hi - mapStart) / mapSize) * 100];
        }

        // Los límites de pantalla de abajo (layoutExplicitPopups/layoutDynPopups)
        // se calculan UNA vez, apenas cargan los datos — antes de que el documento
        // se incline (el giro 3D llega después, cuando la reproducción avanza a ese
        // paso). Pero #dynamic-stage se corre con --stage-pan-x/-y en cuanto se
        // inclina (ver su transform arriba), así que el rectángulo real donde va a
        // terminar el documento en pantalla NO es el mismo que el que se mide aquí.
        // Sin corregir esto, una tarjeta cerca del borde del límite calculado
        // (contra la posición SIN inclinar) podía terminar empujada de más hacia un
        // lado una vez que el documento se corría con la inclinación — por eso
        // algunas tarjetas "jalaban" bien y otras no, según qué tan cerca
        // estuvieran de ese borde. Se simula aquí dónde va a quedar el marco ya
        // inclinado, para calcular el límite contra ESA posición final.
        const STAGE_PAN_X_PCT = 44; // debe coincidir con el -6% (= -50%+44%) de #dynamic-stage
        const STAGE_PAN_Y_PCT = 0;  // debe coincidir con el -50% (sin cambio) de #dynamic-stage
        function getPannedRect(rect) {
            const left = rect.left + (STAGE_PAN_X_PCT / 100) * rect.width;
            const top = rect.top + (STAGE_PAN_Y_PCT / 100) * rect.height;
            return { left, top, width: rect.width, height: rect.height, right: left + rect.width, bottom: top + rect.height };
        }

        // Tarjetas con posición guardada a mano (panel.tarjeta, puesta desde la
        // Vista Previa 3D del editor): se colocan directo ahí en vez de calcularla.
        // "top"/"left" son el centro exacto que la persona eligió al arrastrarla
        // (ver .explicit-pos arriba, que centra en los dos ejes).
        function layoutExplicitPopups(overlayEl, items) {
            if (!items.length) return;
            const overlayRect = overlayEl.getBoundingClientRect();
            if (!overlayRect.height) return;
            const pannedRect = getPannedRect(overlayRect); // ver nota arriba de getPannedRect

            items.forEach(({ popup, line, top, left }) => {
                try {
                    // Se pone primero sin límite, para medir el tamaño real ya
                    // renderizado de la tarjeta (el límite de abajo depende de eso).
                    popup.style.top = top + '%';
                    popup.style.left = left + '%';

                    // Límite real de pantalla (no un margen de % arbitrario como
                    // antes, [-150,250]): el CENTRO de la tarjeta nunca puede
                    // quedar fuera de la ventana visible del navegador — mismo
                    // problema y mismo arreglo que ya se hizo en el editor
                    // (clampCardPercent): usar los píxeles reales de la pantalla
                    // en vez de un número de % inventado, que en una ventana
                    // angosta dejaba una tarjeta "afuera" del documento
                    // literalmente fuera de la pantalla (inalcanzable/invisible).
                    // Se calcula contra pannedRect (dónde va a quedar el marco ya
                    // inclinado), no contra overlayRect (su posición actual, plana).
                    const cardRect = popup.getBoundingClientRect();
                    const halfW = cardRect.width / 2;
                    const halfH = cardRect.height / 2;
                    const margin = 16;
                    const [minX, maxX] = pctRangeForSafety(pannedRect.left, pannedRect.width, 0, window.innerWidth, halfW, margin);
                    const [minY, maxY] = pctRangeForSafety(pannedRect.top, pannedRect.height, 0, window.innerHeight, halfH, margin);

                    const topPct = Math.min(Math.max(top, minY), maxY);
                    const leftPct = Math.min(Math.max(left, minX), maxX);
                    popup.style.top = topPct + '%';
                    popup.style.left = leftPct + '%';

                    const popupRect = popup.getBoundingClientRect();
                    const centerXPct = ((popupRect.left + popupRect.width / 2 - overlayRect.left) / overlayRect.width) * 100;
                    const centerYPct = ((popupRect.top + popupRect.height / 2 - overlayRect.top) / overlayRect.height) * 100;
                    if (isFinite(centerXPct)) line.setAttribute('x2', centerXPct + '%');
                    if (isFinite(centerYPct)) line.setAttribute('y2', centerYPct + '%');
                } catch (e) {
                    console.error('No se pudo acomodar una tarjeta con posición manual', e);
                }
            });
        }


        // Acomoda las tarjetas una sola vez (no en cada cuadro): mide su alto real
        // y las apila dentro de un rango vertical ya calibrado a ojo para el giro
        // fijo del documento (rotateX 55°/rotateZ -20°/perspective 1200px, igual
        // para cualquier manual), así no quedan "debajo" de donde termina la
        // imagen. El borde (no el centro) de cada tarjeta queda fijo a un 2% del
        // marco, para que nunca se salga de la pantalla sin importar su ancho.
        function layoutDynPopups(overlayEl, itemsBySide) {
            const overlayRect = overlayEl.getBoundingClientRect();
            if (!overlayRect.height) return;

            const V_TOP = 18;
            const V_BOTTOM = 62;
            const available = V_BOTTOM - V_TOP;
            const GAP_PCT = 6; // espacio cómodo fijo entre tarjetas
            const MIN_GAP_PCT = 3; // piso absoluto: ni el vaivén de abajo puede bajar de esto
            // Vaivén fijo (no aleatorio de verdad, para que no "salte" distinto cada
            // vez que se recarga) según la posición de la tarjeta en su columna: le
            // da personalidad sin arriesgar que dos tarjetas se encimen.
            const JITTER_PCT = [0, 1.8, -1.4, 2.2, -1.8, 1.2];

            // Todas las tarjetas usaban el mismo -14% fijo (ver .side-left/.side-right
            // en el CSS): por eso sus bordes quedaban perfectamente alineados en una
            // sola línea, sin importar el vaivén vertical de arriba. Aquí se varía
            // también qué tan "afuera" queda cada una. Sale por JS y no por CSS
            // porque cada tarjeta necesita SU PROPIO valor (una clase no alcanza).
            const OUT_OFFSET_BASE = -14;
            const OUT_OFFSET_VARIATION = [0, -5, 3, -8, 2, -4];

            // El offset "hacia afuera" nunca puede rebasar el espacio real (en px)
            // que hay entre el documento y el borde de la pantalla de ESE lado —
            // calculado de verdad, no adivinado con un ancho de pantalla fijo (eso
            // se salía del campo en tablets, que no son ni celular ni monitor).
            // Contra pannedRect (dónde va a quedar el marco ya inclinado), no
            // overlayRect (su posición actual, plana) — ver nota de getPannedRect.
            const pannedRect = getPannedRect(overlayRect);
            const SAFETY_MARGIN_PX = 16;
            const spaceLeftPx = Math.max(0, pannedRect.left - SAFETY_MARGIN_PX);
            const spaceRightPx = Math.max(0, window.innerWidth - pannedRect.right - SAFETY_MARGIN_PX);
            const maxOutPct = {
                left: (spaceLeftPx / pannedRect.width) * 100,
                right: (spaceRightPx / pannedRect.width) * 100
            };

            Object.entries(itemsBySide).forEach(([side, list]) => {
                if (!list.length) return;
                try {
                    // Alto de respaldo (15%) si una tarjeta no se pudo medir bien, para
                    // que las que le siguen no se queden sin acomodar por su culpa.
                    const heightsPct = list.map(({ popup }) => {
                        const h = popup.offsetHeight;
                        return isFinite(h) && h > 0 ? (h / overlayRect.height) * 100 : 15;
                    });
                    const totalHeightPct = heightsPct.reduce((a, b) => a + b, 0);
                    const stackHeightPct = totalHeightPct + GAP_PCT * Math.max(0, list.length - 1);

                    // Si sobra espacio, la columna se CENTRA en el rango disponible en
                    // vez de siempre empezar arriba y estirarse hasta el límite de abajo
                    // (eso era lo que se sentía tan mecánico/"al límite"). Si no sobra
                    // espacio (muchas tarjetas altas), simplemente se empieza arriba.
                    const baseTop = V_TOP + Math.max(0, (available - stackHeightPct) / 2);

                    let cursor = baseTop;
                    let prevBottom = null;
                    list.forEach(({ popup, line }, i) => {
                        const hPct = heightsPct[i];
                        try {
                            const jitter = JITTER_PCT[i % JITTER_PCT.length];
                            let top = cursor + jitter;
                            // El vaivén nunca puede acercar esta tarjeta a la anterior más
                            // del piso mínimo, sin importar hacia dónde haya jitteado.
                            if (prevBottom !== null) top = Math.max(top, prevBottom + MIN_GAP_PCT);

                            const centerPct = Math.min(Math.max(top + hPct / 2, 5), 95);
                            popup.style.top = centerPct + '%';

                            const desiredOffset = OUT_OFFSET_BASE + OUT_OFFSET_VARIATION[i % OUT_OFFSET_VARIATION.length];
                            const outOffset = Math.max(desiredOffset, -maxOutPct[side]); // no más negativo (afuera) que lo seguro
                            popup.style[side] = outOffset + '%';

                            // x2: el borde de la tarjeta que mira hacia la imagen (izquierdo
                            // si la tarjeta está a la derecha, y viceversa), medido ya con
                            // la tarjeta en su posición final (por eso "top" va primero).
                            const popupRect = popup.getBoundingClientRect();
                            const edgeX = side === 'right' ? popupRect.left : popupRect.right;
                            const x2Pct = ((edgeX - overlayRect.left) / overlayRect.width) * 100;
                            if (isFinite(x2Pct)) line.setAttribute('x2', x2Pct + '%');
                            if (isFinite(centerPct)) line.setAttribute('y2', centerPct + '%');

                            prevBottom = top + hPct;
                        } catch (e) {
                            // Si esta tarjeta falla, que las que siguen en la misma fila
                            // igual se acomoden (no se detiene el resto por su culpa).
                            console.error('No se pudo acomodar un punto', e);
                        }
                        cursor += hPct + GAP_PCT;
                    });
                } catch (e) {
                    console.error('No se pudieron acomodar las tarjetas de un lado', side, e);
                }
            });
        }

        // Construye en el escenario dinámico (único, reutilizado — ver
        // ensureDynamicStage) los pines/tarjetas/líneas de la página "pageIndex":
        // limpia lo que hubiera de la página anterior primero. Se llama la
        // primera vez que se necesita el escenario genérico, y de nuevo cada vez
        // que la reproducción cruza a otra página (ver pageIndexForStep/renderStep).
        // Reconstruye el contenido (imagen + pines + tarjetas + líneas) de UNA
        // página dentro del escenario dinámico ya existente — separado de
        // renderPaginaDinamica() para que ese pueda envolver la llamada en un
        // fundido cuando se trata de un cambio de página real (ver abajo).
        function buildPaginaDinamicaContent(pagina, stage, dynDoc, overlay, svg) {
            const image = document.getElementById('dynamic-image');
            if (pagina.canvas && (pagina.canvas.url || pagina.canvas.imageData)) {
                image.src = pagina.canvas.url || pagina.canvas.imageData;
                // El stage se queda en su aspect-ratio fijo (1.4:1); ver nota de ensureDynamicStage.
            }
            overlay.innerHTML = '';
            svg.innerHTML = '';
            dynDoc.querySelectorAll('.dyn-pin').forEach(el => el.remove());
            dynItems.length = 0;
            panelEls = {}; // limpia las referencias de la página anterior (sus elementos ya no existen)

            const customPaneles = pagina.paneles;
            const sideOf = sidePanelesFor(customPaneles);
            const itemsBySide = { left: [], right: [] };
            // Puntos con "tarjeta" guardada a mano (desde la Vista Previa del
            // editor): se acomodan aparte, directo en su posición — no entran
            // al apilado automático de itemsBySide.
            const explicitItems = [];

            customPaneles.forEach(panel => {
              try {
                const side = sideOf[panel.id];
                const color = panel.color || '#00f0ff';
                const tarjetaTop = panel.tarjeta && parseFloat(panel.tarjeta.top);
                const tarjetaLeft = panel.tarjeta && parseFloat(panel.tarjeta.left);
                const hasExplicitPos = isFinite(tarjetaTop) && isFinite(tarjetaLeft);

                // El pin vive DENTRO de .dyn-doc (el elemento que se inclina en 3D),
                // no en la capa plana: así queda pegado al punto correcto de la
                // imagen sin importar el ángulo. La línea/tarjeta sí se quedan planas
                // (legibles); syncDynLines sigue al pin en vivo (ver más arriba).
                const pin = document.createElement('div');
                pin.className = 'dyn-pin';
                pin.style.left = toPercent(panel.origen.x);
                pin.style.top = toPercent(panel.origen.y);
                pin.style.background = color;
                dynDoc.appendChild(pin);

                // x1/y1 los pone syncDynLines en cada cuadro; y2 lo pone
                // layoutDynPopups una sola vez, junto con la tarjeta.
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('stroke', color);
                line.setAttribute('stroke-width', '2');
                line.setAttribute('class', 'dashed-line');
                svg.appendChild(line);
                dynItems.push({ pin, line });

                // Se fija el borde (izquierdo o derecho) de la tarjeta, no su centro,
                // para que nunca se salga de la pantalla sin importar qué tan ancha
                // salga según su contenido. "top" lo pone layoutDynPopups más abajo.
                const popup = document.createElement('div');
                popup.className = hasExplicitPos
