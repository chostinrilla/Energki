                    ? 'pop-panel dyn-popup explicit-pos'
                    : `pop-panel dyn-popup side-${side}`;
                // El offset (izq/der) ya lo pone el CSS de .side-left/.side-right
                // (así la media query de pantallas angostas lo puede recortar).
                popup.style.borderColor = color;
                popup.style.boxShadow = `0 0 25px ${color}55`;
                popup.innerHTML = renderPopupContent(panel);
                overlay.appendChild(popup);
                if (hasExplicitPos) {
                    explicitItems.push({ popup, line, top: tarjetaTop, left: tarjetaLeft });
                } else {
                    itemsBySide[side].push({ popup, line });
                }

                panelEls[panel.id] = {
                    activate: () => { pin.classList.add('active'); popup.classList.add('active'); line.classList.add('active'); },
                    deactivate: () => { pin.classList.remove('active'); popup.classList.remove('active'); line.classList.remove('active'); }
                };
              } catch (e) {
                // Si un punto trae algún dato raro y falla, que no tumbe la
                // creación de los que siguen.
                console.error('No se pudo crear el punto', panel && panel.id, e);
              }
            });

            layoutDynPopups(overlay, itemsBySide);
            layoutExplicitPopups(overlay, explicitItems);

            // Vuelve a acomodar una vez que la fuente (Rajdhani, Google Fonts)
            // termine de cargar de verdad: el cálculo de arriba mide el tamaño
            // REAL de cada tarjeta ya renderizada para no salirse de pantalla,
            // pero si en ese instante la fuente aún no había cargado, se medía
            // con la fuente de repuesto del sistema (tamaño distinto) y esa
            // medida mala quedaba fija — por eso a veces la posición salía bien
            // (fuente ya en caché) y a veces un poco desfasada (fuente lenta).
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => {
                    layoutDynPopups(overlay, itemsBySide);
                    layoutExplicitPopups(overlay, explicitItems);
                });
            }
        }

        // Token para descartar un fundido en camino si se pide OTRA página antes
        // de que termine (ej. alguien le da "Adelantar" varias veces seguidas) —
        // sin esto, dos cambios de página seguidos podían pisarse a medio fundido.
        let dynSwapToken = 0;

        function renderPaginaDinamica(pageIndex) {
            const pagina = customPaginas[pageIndex];
            if (!pagina) return;
            // Ya había una página distinta construida (no la primera vez que se
            // arma el escenario): en vez de reemplazar la imagen/pines/tarjetas de
            // golpe (ya inclinados, se sentía como un salto brusco), se funden a
            // negro un instante, se reconstruye todo por dentro, y se vuelve a
            // fundir hacia arriba — igual de simple, pero ya no se ve como un
            // "parpadeo" de la imagen.
            const isPageSwitch = activeDynPageIndex !== -1 && activeDynPageIndex !== pageIndex;
            activeDynPageIndex = pageIndex;

            const stage = ensureDynamicStage();
            const dynDoc = stage.querySelector('.dyn-doc');
            const overlay = document.getElementById('dyn-overlay');
            const svg = document.getElementById('dyn-overlay-svg');

            if (!isPageSwitch) {
                buildPaginaDinamicaContent(pagina, stage, dynDoc, overlay, svg);
                return;
            }

            // Se funden la IMAGEN y la capa de pines/tarjetas — NO .dyn-doc (el
            // contenedor que se inclina): ese ya tiene su propia transición de
            // "transform" a 2s (transition: all ...) para el giro 3D; ponerle
            // también una de opacity aquí pisaría esa regla y dejaría de animar el
            // giro la próxima vez que se active/desactive is-3d.
            const image = document.getElementById('dynamic-image'); 
            const myToken = ++dynSwapToken;
            const FADE_MS = 280;
            [image, overlay, svg].forEach(el => {
                el.style.transition = `opacity ${FADE_MS}ms ease`;
                el.style.opacity = '0';
            });
            setTimeout(() => {
                if (myToken !== dynSwapToken) return; // se pidió otra página mientras tanto
                buildPaginaDinamicaContent(pagina, stage, dynDoc, overlay, svg);
                [image, overlay, svg].forEach(el => { el.style.opacity = '1'; });
            }, FADE_MS);
        }

        function applyEditorData(data) {
            if (!data) return;
            // Compatibilidad: manuales guardados antes de "paginas" traen
            // "canvas"/"paneles" sueltos en la raíz, no un arreglo "paginas". Si
            // no viene "paginas", se arma uno solo con esos datos — se ve y
            // reproduce exactamente igual que antes, como su única página.
            const rawPaginas = (Array.isArray(data.paginas) && data.paginas.length)
                ? data.paginas
                : (Array.isArray(data.paneles) && data.paneles.length ? [{ canvas: data.canvas, paneles: data.paneles }] : []);
            if (!rawPaginas.length) return;

            while (steps.length > baseStepsCount) steps.pop();

            // 'intro-splash'/'portada-3d' (namedPanels) son ids reservados para la
            // intro (logo + inclinación) — cualquier otro id de panel usa el
            // escenario genérico, que sí puede tener varias páginas.
            customPaginas = rawPaginas.map(pg => ({
                canvas: pg.canvas,
                paneles: (pg.paneles || []).filter(p => !namedPanels[p.id]),
                contexto: pg.contexto || ''
            }));
            panelPageIndex = {};
            customPaginas.forEach((pg, idx) => {
                pg.paneles.forEach(p => { panelPageIndex[p.id] = idx; });
            });
            usingDynamicStage = customPaginas.some(pg => pg.paneles.length > 0);
            activeDynPageIndex = -1; // fuerza a reconstruir aunque termine siendo "otra vez la página 0"

            if (usingDynamicStage) {
                const firstIndexWithContent = customPaginas.findIndex(pg => pg.paneles.length > 0);
                renderPaginaDinamica(firstIndexWithContent >= 0 ? firstIndexWithContent : 0);
            }

            // Todos los paneles genéricos de TODAS las páginas, EN ORDEN — para el
            // guion de abajo (tanto para completar pasos que falten como para el
            // caso sin guion propio). El orden por página es justo lo que hace que
            // la narración termine la página 1 antes de mencionar la 2.
            const allCustomPaneles = customPaginas.flatMap(pg => pg.paneles);

            if (Array.isArray(data.steps) && data.steps.length) {
                data.steps
                    .slice()
                    .sort((a, b) => (a.order || 0) - (b.order || 0))
                    .forEach(step => {
                        const panelIds = step.panelIds || [];
                        steps.push({
                            text: step.text || '',
                            panelIds,
                            // pageFlat (ensurePaginaContextSteps/buildAutoSteps en el
                            // editor): marca los pasos de "contexto" de página, planos
                            // — sin copiarla aquí, pageIndexForStep/stepWantsTilt no
                            // podrían distinguirlos de un punto normal.
                            pageFlat: step.pageFlat,
                            activate: () => panelIds.forEach(activatePanel),
                            deactivate: () => panelIds.forEach(deactivatePanel)
                        });
                    });

                // Paneles agregados después (desde el editor) que ningún paso todavía
                // menciona: se muestran igual, como pasos extra al final.
                const referenced = new Set();
                data.steps.forEach(s => (s.panelIds || []).forEach(id => referenced.add(id)));
                const unreferenced = allCustomPaneles.filter(p => !referenced.has(p.id));
                unreferenced.forEach(panel => {
                    steps.push({
                        text: panel.narrativa || panel.titulo || panel.id,
                        panelIds: [panel.id],
                        activate: () => activatePanel(panel.id),
                        deactivate: () => deactivatePanel(panel.id)
                    });
                });
            } else {
                // Sin guion propio (manual muy viejo, o cargado sin pasar por el
                // editor): se arma uno mínimo aquí, página por página, con su
                // "contexto" (si tiene) antes de sus puntos — mismo criterio que
                // buildAutoSteps() en el editor.
                customPaginas.forEach((pg, idx) => {
                    const contexto = idx > 0 ? (pg.contexto || '').trim() : '';
                    if (contexto) {
                        steps.push({
                            text: contexto,
                            panelIds: [],
                            pageFlat: idx,
                            activate: () => {},
                            deactivate: () => {}
                        });
                    }
                    pg.paneles.forEach(panel => {
                        steps.push({
                            text: panel.narrativa || panel.titulo || panel.id,
                            panelIds: [panel.id],
                            activate: () => activatePanel(panel.id),
                            deactivate: () => deactivatePanel(panel.id)
                        });
                    });
                });
            }

            resetPresentation();
        }

        async function cargarManualPorId() {
            if (!trainingId || trainingId === LEGACY_DEMO_ID) return;

            if (!API_URL || API_URL === 'PEGA_AQUI_TU_URL_DE_APPS_SCRIPT') {
                subtitleBox.innerHTML = 'Falta configurar API_URL en config.js.';
                return;
            }

            subtitleBox.innerHTML = 'Cargando manual...';
            try {
                const res = await fetch(`${API_URL}?action=getTraining&id=${encodeURIComponent(trainingId)}`);
                const data = await res.json();
                if (data.error) throw new Error(data.error);

                applyEditorData(data);
                subtitleBox.innerHTML = '<span class="k-word highlight">Presiona</span> <span class="k-word highlight">Play</span> <span class="k-word highlight">para</span> <span class="k-word highlight">Iniciar</span> <span class="k-word highlight">la</span> <span class="k-word highlight">Capacitación</span>';
                [btnPlay, btnPrev, btnNext, btnRestart].forEach(b => b.disabled = false);
            } catch (err) {
                // Si falló la carga no hay pasos que reproducir: los controles se
                // quedan deshabilitados (si se reactivaran, apretar Play tronaría igual).
                subtitleBox.innerHTML = 'No se pudo cargar el manual: ' + err.message;
            }
        }
        cargarManualPorId();
    </script>
</body>
</html>
