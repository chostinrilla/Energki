<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energki Builder - Manuales de Entrenamiento</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap');

        body {
            margin: 0; padding: 40px;
            background-color: #050a12;
            background-image: radial-gradient(circle at 50% -20%, rgba(0, 170, 255, 0.15) 0%, transparent 50%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 16px;
        }

        h1 { margin: 0; color: #00f0ff; letter-spacing: 1px; }

        .brand { display: flex; align-items: center; gap: 16px; }
        .btn {
            background: #00f0ff; color: #000; border: none;
            padding: 10px 18px; font-size: 16px; font-weight: bold;
            cursor: pointer; border-radius: 4px; text-transform: uppercase;
            transition: 0.2s; font-family: 'Rajdhani', sans-serif;
        }
        .btn:hover { background: #fff; }
        .btn-secondary { background: transparent; border: 1px solid #00f0ff; color: #00f0ff; }
        .btn-secondary:hover { background: rgba(0,240,255,0.1); color: #fff; }

        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: #888; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        td { font-size: 16px; }

        .status-pill {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .status-draft { background: rgba(255, 170, 0, 0.15); color: #ffaa00; }
        .status-published { background: rgba(0, 255, 136, 0.15); color: #00ff88; }

        .row-actions { display: flex; gap: 8px; }

        /* --- BOTONES DE ICONO (carpeta /images), mismo sistema que el editor ---
           Un <img> normal adentro del botón (nada de mask/background-image que
           podían no renderizar). Sin marco cuadrado: sin borde, resplandor
           circular sutil al pasar el cursor. */
        .icon-btn {
            width: 36px; height: 36px;
            display: inline-flex; align-items: center; justify-content: center;
            background: transparent;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
            transition: background-color 0.2s, transform 0.15s;
        }
        .icon-btn img { width: 18px; height: 18px; display: block; pointer-events: none; }
        .icon-btn:hover { background-color: rgba(0,240,255,0.15); transform: scale(1.08); }
        .icon-btn.danger:hover { background-color: rgba(255,85,102,0.15); }

        #empty-state, #loading-state, #error-state {
            padding: 40px; text-align: center; color: #888; font-size: 18px;
        }
        #error-state { color: #ff5566; }

        #intro-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #intro-screen.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #skip-intro {
            position: absolute;
            right: 24px;
            bottom: 24px;
            background: rgba(0, 240, 255, 0.9);
            color: #000;
            border: 0;
            border-radius: 4px;
            padding: 10px 16px;
            font: 700 15px 'Rajdhani', sans-serif;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.6s ease;
        }

        #skip-intro:hover { background: #fff; }

        #skip-intro.skip-hidden { opacity: 0; pointer-events: none; }

        #start-intro {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #00f0ff;
            color: #000;
            border: 0;
            border-radius: 4px;
            padding: 14px 22px;
            font: 700 18px 'Rajdhani', sans-serif;
            text-transform: uppercase;
            cursor: pointer;
        }

        #start-intro:hover { background: #fff; }

        /* --- MODAL PROPIO (reemplaza alert()/confirm() del navegador) --- */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.65);
            display: flex; align-items: center; justify-content: center;
            z-index: 3000;
        }
        .modal-overlay[hidden] { display: none; }
        .modal-box {
            background: #0a101a;
            border: 1px solid #00f0ff;
            border-radius: 8px;
            padding: 24px 26px;
            max-width: 420px; width: 90%;
            box-shadow: 0 0 30px rgba(0,240,255,0.25);
        }
        .modal-box p { margin: 0 0 20px 0; font-size: 16px; line-height: 1.5; color: #fff; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .modal-actions .btn { margin-top: 0; }
    </style>
</head>
<body>

    <div id="intro-screen" aria-label="Introducción de Energki Builder">
        <video id="intro-video" autoplay playsinline>
            <source src="../intro-video.mp4" type="video/mp4">
        </video>
        <button id="start-intro" type="button" hidden>Reproducir con sonido</button>
        <button id="skip-intro" type="button">Omitir intro</button>
    </div>

    <div class="top-bar">
        <div class="brand">
            <h1>Manuales de Entrenamiento</h1>
        </div>
        <button class="icon-btn" onclick="location.href='editor.html'" title="Crear nuevo manual" aria-label="Crear nuevo manual"><img src="../images/icon-add-cy.png" alt=""></button>
    </div>

    <div id="loading-state">Cargando manuales...</div>
    <div id="error-state" hidden></div>
    <div id="empty-state" hidden>Aún no hay manuales guardados. Crea el primero con "+ Nuevo Manual".</div>

    <table id="trainings-table" hidden>
        <thead>
            <tr>
                <th>Título</th>
                <th>Estado</th>
                <th>Actualizado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="trainings-body"></tbody>
    </table>

    <!-- Modal propio (reemplaza alert()/confirm() del navegador) -->
    <div id="modal-overlay" class="modal-overlay" hidden>
        <div class="modal-box">
            <p id="modal-message"></p>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // --- Modal propio: reemplaza alert()/confirm() del navegador ---
        const modalOverlay = document.getElementById('modal-overlay');
        const modalMessage = document.getElementById('modal-message');
        const modalActions = document.getElementById('modal-actions');

        function showModal(message, buttons) {
            return new Promise(resolve => {
                modalMessage.textContent = message;
                modalActions.innerHTML = '';
                buttons.forEach(btn => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = btn.primary ? 'btn' : 'btn btn-secondary';
                    b.textContent = btn.label;
                    b.onclick = () => { modalOverlay.hidden = true; resolve(btn.value); };
                    modalActions.appendChild(b);
                });
                modalOverlay.hidden = false;
            });
        }

        function appAlert(message) {
            return showModal(message, [{ label: 'Entendido', primary: true, value: true }]);
        }

        function appConfirm(message, confirmLabel, cancelLabel) {
            return showModal(message, [
                { label: cancelLabel || 'Cancelar', primary: false, value: false },
                { label: confirmLabel || 'Continuar', primary: true, value: true }
            ]);
        }

        const introScreen = document.getElementById('intro-screen');
        const introVideo = document.getElementById('intro-video');
        const startIntro = document.getElementById('start-intro');
        const skipIntro = document.getElementById('skip-intro');

        function closeIntro() {
            introScreen.classList.add('is-hidden');
            introVideo.pause();
        }

        // Igual que en Netflix: el botón de "Omitir intro" desaparece solo si no
        // se usa en los primeros segundos, para no estorbar el resto del video.
        let skipTimer = null;
        function startSkipTimer() {
            if (skipTimer) return;
            skipTimer = setTimeout(() => { skipIntro.classList.add('skip-hidden'); }, 3000);
        }

        introVideo.addEventListener('ended', closeIntro);
        introVideo.addEventListener('error', closeIntro);
        introVideo.addEventListener('playing', startSkipTimer, { once: true });
        introVideo.play().catch(() => {
            startIntro.hidden = false;
        });
        startIntro.addEventListener('click', function() {
            startIntro.hidden = true;
            introVideo.play();
        });
        skipIntro.addEventListener('click', function() {
            clearTimeout(skipTimer);
            closeIntro();
        });

        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');
        const emptyState = document.getElementById('empty-state');
        const table = document.getElementById('trainings-table');
        const tbody = document.getElementById('trainings-body');

        function formatDate(value) {
            const d = new Date(value);
            return isNaN(d.getTime()) ? value : d.toLocaleString('es-MX');
        }

        function renderRow(training) {
            const tr = document.createElement('tr');
            tr.dataset.id = training.id;

            const statusClass = training.status === 'published' ? 'status-published' : 'status-draft';
            tr.innerHTML = `
                <td>${training.title || 'Sin título'}</td>
                <td><span class="status-pill ${statusClass}">${training.status || 'draft'}</span></td>
                <td>${formatDate(training.updatedAt)}</td>
                <td class="row-actions">
                    <button class="icon-btn" title="Editar" aria-label="Editar" onclick="editTraining('${training.id}')"><img src="../images/icon-edit-cy.png" alt=""></button>
                    <button class="icon-btn" title="Reproducir" aria-label="Reproducir" onclick="playTraining('${training.id}')"><img src="../images/icon-play-cy.png" alt=""></button>
                    <button class="icon-btn danger" title="Eliminar" aria-label="Eliminar" onclick="deleteTraining('${training.id}', '${(training.title || 'Sin título').replace(/'/g, "\\'")}')"><img src="../images/icon-trash-red.png" alt=""></button>
                </td>
            `;
            return tr;
        }

        function editTraining(id) {
            location.href = `editor.html?id=${encodeURIComponent(id)}`;
        }

        function playTraining(id) {
            window.open(`viewer.html?id=${encodeURIComponent(id)}`, '_blank');
        }

        async function deleteTraining(id, title) {
            const confirmed = await appConfirm(
                `¿Eliminar "${title}"? También se manda su carpeta de imágenes a la papelera de Drive. Esta acción no se puede deshacer desde aquí.`,
                'Eliminar',
                'Cancelar'
            );
            if (!confirmed) return;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'deleteTraining', id })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);

                const row = tbody.querySelector(`tr[data-id="${id}"]`);
                if (row) row.remove();
                if (!tbody.children.length) {
                    table.hidden = true;
                    emptyState.hidden = false;
                }
            } catch (err) {
                await appAlert('No se pudo eliminar: ' + err.message);
            }
        }

        async function loadTrainings() {
            if (!API_URL || API_URL === 'PEGA_AQUI_TU_URL_DE_APPS_SCRIPT') {
                loadingState.hidden = true;
                errorState.hidden = false;
                errorState.textContent = 'Falta configurar API_URL en config.js con la URL del backend de Apps Script.';
                return;
            }

            try {
                const res = await fetch(`${API_URL}?action=listTrainings`);
                const data = await res.json();
                if (data.error) throw new Error(data.error);

                loadingState.hidden = true;

                if (!data.length) {
                    emptyState.hidden = false;
                    return;
                }

                data.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
                data.forEach(training => tbody.appendChild(renderRow(training)));
                table.hidden = false;
            } catch (err) {
                loadingState.hidden = true;
                errorState.hidden = false;
                errorState.textContent = 'No se pudo cargar la lista de manuales: ' + err.message;
            }
        }

        loadTrainings();
    </script>
</body>
</html>
